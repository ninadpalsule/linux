%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/aspeed/aspeed,espi.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Aspeed eSPI Controller

maintainers:
  - Manojkiran Eda <manojkiran.eda@gmail.com>
  - Patrick Rudolph <patrick.rudolph@9elements.com>
  - Chia-Wei Wang <chiawei_wang@aspeedtech.com>
  - Ryan Chen <ryan_chen@aspeedtech.com>

description:
  Aspeed eSPI controller implements a device side eSPI endpoint device
  supporting the flash channel.

properties:
  compatible:
    items:
      - enum:
          - aspeed,ast2500-espi
          - aspeed,ast2600-espi
      - const: simple-mfd
      - const: syscon

  reg:
    maxItems: 1

  "#address-cells":
    const: 1

  "#size-cells":
    const: 1

  ranges: true

patternProperties:
  "^espi-ctrl@[0-9a-f]+$":
    type: object

    description: Controls the flash channel of eSPI hardware

    properties:
      compatible:
        items:
          - enum:
              - aspeed,ast2500-espi-ctrl
              - aspeed,ast2600-espi-ctrl

      interrupts:
        maxItems: 1

      clocks:
        maxItems: 1

    required:
      - compatible
      - interrupts
      - clocks

required:
  - compatible
  - reg
  - "#address-cells"
  - "#size-cells"
  - ranges

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/clock/ast2600-clock.h>

    espi: espi@1e6ee000 {
        compatible = "aspeed,ast2600-espi", "simple-mfd", "syscon";
        reg = <0x1e6ee000 0x1000>;

        #address-cells = <1>;
        #size-cells = <1>;
        ranges = <0x0 0x1e6ee000 0x1000>;

        espi_ctrl: espi-ctrl@0 {
            compatible = "aspeed,ast2600-espi-ctrl";
            reg = <0x0 0x800>,<0x0 0x4000000>;
            reg-names = "espi_ctrl","espi_flash";
            interrupts = <GIC_SPI 42 IRQ_TYPE_LEVEL_HIGH>;
            clocks = <&syscon ASPEED_CLK_GATE_ESPICLK>;
        };
    };
